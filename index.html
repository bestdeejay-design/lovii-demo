<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOVII — всё в шаговой доступности</title>
  <meta name="description" content="Витрина торговых точек района: товары и услуги рядом, наличие в каждой точке и минуты пешком.">
  <meta name="theme-color" id="meta-theme" content="#f64a8a">
  <script>
    /* Тема до отрисовки: явный выбор → системная. Без вспышки светлого */
    (function () {
      try {
        var t = localStorage.getItem('lovii_theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LOVII">
  <link rel="icon" type="image/svg+xml" href="assets/lovii-icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/lovii-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/lovii-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/lovii.css?v=18">
</head>
<body>
  <div class="app">
    <!-- Шапка: логотип, район, корзина -->
    <header class="app-header">
      <div class="app-header-in">
        <button class="logo" data-go="home" aria-label="LOVII — на главную">
          <img class="logo-img logo-light-img" src="assets/lovii-logo-light.svg" alt="LOVII" width="153" height="32">
          <img class="logo-img logo-dark-img" src="assets/lovii-logo-dark.svg" alt="LOVII" width="153" height="32">
        </button>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="pill-btn" data-action="open-sheet" aria-label="Выбрать район">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <span class="lbl" id="district-label">Район</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button class="icon-btn" data-action="theme-toggle" aria-label="Сменить тему" title="Светлая/тёмная тема">
            <svg class="theme-ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            <svg class="theme-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
          <button class="icon-btn" data-go="cart" aria-label="Корзина">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span class="count-badge brand-gradient" id="cart-badge" style="display:none">0</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Экраны -->
    <main id="view"></main>

    <!-- Нижняя навигация -->
    <nav class="app-nav" aria-label="Нижняя навигация">
      <div class="app-nav-in">
        <button class="nav-btn" data-nav="home" data-go="home">
          <span class="top-ind"></span>
          <span class="nav-ico"><svg viewBox="115 190 100 100" fill="none" aria-hidden="true"><path fill="currentColor" stroke="currentColor" stroke-width="3" d="M204.41 218.06c-4.05-6.63-9.49-11.91-16.3-15.84-6.81-3.93-14.38-5.9-22.69-5.9s-15.83 1.97-22.66 5.9c-6.83 3.93-12.28 9.21-16.33 15.84-4.05 6.63-6.08 13.97-6.08 22.04s2.03 15.42 6.08 22.04c4.05 6.63 9.5 11.92 16.33 15.87 6.83 3.95 14.39 5.93 22.66 5.93s15.88-1.98 22.69-5.93c6.81-3.95 12.25-9.24 16.3-15.87 4.05-6.63 6.08-13.97 6.08-22.04s-2.03-15.41-6.08-22.04z"/><path fill="#ffffff" fill-rule="evenodd" d="M187.92 223.98c-5.58-5.58-14.62-5.58-20.2 0l-2.31 2.31-2.31-2.31c-5.58-5.58-14.62-5.58-20.2 0-4.91 4.91-5.5 12.5-1.76 18.06 4.63 5.66 10.69 11.91 24.42 24.5l22.36-22.36c5.58-5.58 5.58-14.62 0-20.2z"/></svg></span>
          Главная
        </button>
        <button class="nav-btn" data-nav="search" data-go="search">
          <span class="top-ind"></span>
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
          Поиск
        </button>
        <button class="nav-btn" data-nav="cart" data-go="cart">
          <span class="top-ind"></span>
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="nav-count brand-gradient" id="nav-cart-badge" style="display:none">0</span></span>
          Корзина
        </button>
        <button class="nav-btn" data-nav="orders" data-go="orders">
          <span class="top-ind"></span>
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
          Заказы
        </button>
        <button class="nav-btn" data-nav="profile" data-go="profile">
          <span class="top-ind"></span>
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          Профиль
        </button>
      </div>
    </nav>
  </div>

  <!-- Шит выбора района -->
  <div class="sheet-overlay" id="sheet-overlay"></div>
  <div class="sheet" id="district-sheet" role="dialog" aria-modal="true" aria-label="Выбор района">
    <div class="sheet-head">
      <h2>Где вы сейчас?</h2>
      <p>Покажем точки и товары в шаговой доступности</p>
    </div>
    <div class="sheet-body"></div>
  </div>

  <!-- Шит установки приложения -->
  <div class="sheet-overlay" id="install-overlay"></div>
  <div class="sheet" id="install-sheet" role="dialog" aria-modal="true" aria-label="Установка приложения">
    <div class="sheet-head">
      <h2>Установить LOVII</h2>
      <p>Открывайте витрину как приложение — с иконки на главном экране</p>
    </div>
    <div class="sheet-body" id="install-body"></div>
  </div>

  <!-- Тосты -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="js/data.js?v=16"></script>
  <script src="js/geo.js?v=16"></script>
  <script src="js/icons.js?v=16"></script>
  <script src="js/charts.js?v=16"></script>
  <script src="js/screens.js?v=16"></script>
  <script src="js/dash.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
</body>
</html>
