  <title>Лови — всё в шаговой доступности</title>
  <meta name="description" content="Витрина торговых точек района: товары и услуги рядом, наличие в каждой точке и минуты пешком.">
  <meta name="theme-color" id="meta-theme" content="#f64a8a">
  <script>
    /* Тема до отрисовки: явный выбор → системная. Без вспышки светлого */
    (function () {
      try {
        var t = localStorage.getItem('lovii_theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <script>
    /* Dev/preview safety: if JS breaks, show the error instead of a white screen. */
    (function () {
      function showLoviiBootError(title, detail) {
        try {
          var box = document.getElementById('lovii-boot-error');
          if (!box) {
            box = document.createElement('div');
            box.id = 'lovii-boot-error';
            box.style.cssText = 'position:fixed;inset:12px;z-index:99999;overflow:auto;padding:16px;border-radius:16px;background:#171219;color:#fff;font:13px/1.45 Inter,system-ui,sans-serif;box-shadow:0 16px 60px rgba(0,0,0,.35)';
            document.body.appendChild(box);
          }
          box.innerHTML = '<b style="font-size:16px">LOVII demo: ' + title + '</b><pre style="white-space:pre-wrap;margin:12px 0 0;color:#ffd6e5">' + String(detail || '').replace(/[&<>]/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]); }) + '</pre><button onclick="localStorage.clear();location.reload()" style="margin-top:12px;border:0;border-radius:999px;padding:10px 14px;background:#f64a8a;color:white;font-weight:800">Сбросить демо и перезагрузить</button>';
        } catch (_) {}
      }
      window.__loviiBootError = showLoviiBootError;
      window.addEventListener('error', function (e) { showLoviiBootError('ошибка JavaScript', (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + '\n' + (e.error && e.error.stack || '')); });
      window.addEventListener('unhandledrejection', function (e) { showLoviiBootError('ошибка Promise', e.reason && (e.reason.stack || e.reason.message) || e.reason); });
      if ('serviceWorker' in navigator && /e2b\.app$/.test(location.hostname)) {
        navigator.serviceWorker.getRegistrations().then(function (regs) { regs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
        if (window.caches) caches.keys().then(function (keys) { keys.filter(function (k) { return /^lovii-/.test(k); }).forEach(function (k) { caches.delete(k); }); }).catch(function () {});
      }
    })();
  </script>
